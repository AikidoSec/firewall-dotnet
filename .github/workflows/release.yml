name: Publish NuGet Packages

on:
    release:
        types: [created]

permissions: {}

jobs:
    publish:
        permissions:
            contents: read
        runs-on: windows-2025-vs2026
        timeout-minutes: 30

        env:
            DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
            DOTNET_CLI_TELEMETRY_OPTOUT: true
            NUGET_USER: ${{ vars.NUGET_USER || secrets.NUGET_USER }}
            PACKAGE_VERSION: ${{ github.ref_name }}

        steps:
            - name: Checkout code
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  ref: ${{ github.event.release.tag_name }}
                  persist-credentials: false

            - name: Verify release tag points to default branch
              shell: pwsh
              run: |
                  $ErrorActionPreference = "Stop"
                  $tagName = "${{ github.event.release.tag_name }}"
                  $defaultBranch = "${{ github.event.repository.default_branch }}"
                  
                  # Get the commit SHA for the tag
                  $tagCommit = git rev-parse "$tagName^{commit}"
                  Write-Host "Tag $tagName points to commit: $tagCommit"
                  
                  # Check if this commit is reachable from the default branch
                  git fetch origin "$defaultBranch"
                  $isAncestor = git merge-base --is-ancestor $tagCommit "origin/$defaultBranch"
                  if ($LASTEXITCODE -ne 0) {
                    throw "Release tag $tagName (commit $tagCommit) is not an ancestor of the default branch $defaultBranch. Only releases from the default branch are allowed."
                  }
                  Write-Host "Verified: Tag $tagName is on the default branch $defaultBranch"

            - name: Install .NET versions that we need for building the library
              uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
              with:
                  dotnet-version: |
                      6.0
                      7.0
                      8.0

            - name: Add msbuild to PATH
              uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2.0.0
              with:
                  vs-version: "[17.2,19.0)"

            - name: Install dependencies
              run: |
                  dotnet tool restore
                  dotnet restore

            - name: Install Cake Tool
              run: dotnet tool install --global Cake.Tool

            - name: Run Cake Script to Build and Pack
              run: dotnet cake build.cake --target=CreatePackages --libVersion="$env:PACKAGE_VERSION"

            - name: Validate NuGet trusted publishing config
              shell: pwsh
              run: |
                  if ([string]::IsNullOrWhiteSpace($env:NUGET_USER)) {
                    throw "Set vars.NUGET_USER or secrets.NUGET_USER to the nuget.org profile name used for trusted publishing."
                  }

            - name: Validate package artifacts before publishing
              shell: pwsh
              run: |
                  $ErrorActionPreference = "Stop"
                  $expectedPackages = @("Aikido.Zen.DotNetFramework", "Aikido.Zen.DotNetCore")
                  $packages = Get-ChildItem -Path artifacts\*.nupkg -Exclude *.symbols.nupkg
                  
                  if ($packages.Count -eq 0) {
                    throw "No packages found in artifacts directory"
                  }
                  
                  Write-Host "Found $($packages.Count) package(s) to publish:"
                  foreach ($pkg in $packages) {
                    Write-Host "  - $($pkg.Name)"
                    
                    # Verify package name matches expected pattern
                    $matched = $false
                    foreach ($expected in $expectedPackages) {
                      if ($pkg.Name -like "$expected.*") {
                        $matched = $true
                        break
                      }
                    }
                    
                    if (-not $matched) {
                      throw "Unexpected package found: $($pkg.Name). Only packages matching $($expectedPackages -join ', ') are allowed."
                    }
                  }
                  
                  Write-Host "All packages validated successfully"

            - name: NuGet login (OIDC -> temp API key)
              uses: NuGet/login@d22cc5f58ff5b88bf9bd452535b4335137e24544 # v1.1.0
              id: login
              with:
                  user: ${{ env.NUGET_USER }}

            - name: Publish NuGet Packages
              # snupkg are discovered and pushed automatically along with the main package
              env:
                  NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
              run: |
                  $ErrorActionPreference = "Stop"
                  Get-ChildItem -Path artifacts\*.nupkg | ForEach-Object {
                    try {
                      dotnet nuget push $_.FullName --api-key "$env:NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
                      Write-Host "Pushed $($_.FullName)"
                    } catch {
                      Write-Host "Failed to push $($_.FullName)"
                      exit 1
                    }
                  }
