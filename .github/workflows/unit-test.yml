name: Unit tests

on:
    workflow_call: {}
    push: {}
permissions:
    contents: read

jobs:
    build-and-test:
        permissions:
            contents: read
            id-token: write # Aikido code coverage authenticates through GitHub OIDC.
        runs-on: windows-2025-vs2026 # needs to be windows because we support .NET framework
        timeout-minutes: 30
        strategy:
            matrix:
                dotnet-version:
                    [
                        "4.6.1",
                        "4.7.2",
                        "4.8.2",
                        "6.0.x",
                        "7.0.x",
                        "8.0.x",
                        "9.0.x",
                        "10.0.x",
                    ]
            fail-fast: false

        env:
            DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
            DOTNET_CLI_TELEMETRY_OPTOUT: true
            DOTNET_VERSION: ${{ matrix.dotnet-version }}

        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false

            - uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3.5.0
              with:
                  path: |
                      ~/.nuget/packages
                      ~/.local/share/NuGet/v3-cache
                  key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets') }}
                  restore-keys: |
                      ${{ runner.os }}-nuget-

            - name: Setup .NET
              if: ${{ matrix.dotnet-version == '6.0.x' || matrix.dotnet-version == '7.0.x' }} # .NET Framework and .NET Core 8/9/10 are built-in
              uses: actions/setup-dotnet@baa11fbfe1d6520db94683bd5c7a3818018e4309 # v5.1.0
              with:
                  dotnet-version: ${{ matrix.dotnet-version }}

            - name: Add msbuild to PATH
              uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2.0.0
              with:
                  vs-version: "[17.2,19.0)"

            - name: Install dependencies
              run: |
                  dotnet tool restore
                  dotnet restore

            - name: Build and Test
              run: |
                  dotnet tool install --global Cake.Tool
                  dotnet cake --target=Test --configuration=Release --framework="$env:DOTNET_VERSION"

            - name: Upload coverage to Codecov
              if: ${{ matrix.dotnet-version == '10.0.x' }} # Aikido.Zen.Tests targets net10 only
              uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
              continue-on-error: true
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: ./coverage/lcov.info
                  fail_ci_if_error: true
                  slug: AikidoSec/firewall-dotnet

            - name: Upload coverage to Aikido
              if: ${{ matrix.dotnet-version == '10.0.x' && startsWith(github.ref, 'refs/heads/') }} # Aikido.Zen.Tests targets net10 only
              uses: AikidoSec/code-coverage-github-action@0ff927b71e21fab272b1ea628629dcb6a53cbd23 # v1.1.0
              with:
                  lcov-file-paths: coverage/lcov.info
